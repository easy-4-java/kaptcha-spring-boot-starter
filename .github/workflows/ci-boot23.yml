name: CI Boot 2.3

on:
  pull_request:
    branches: [test/20261118]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify starter and coverage
        run: mvn -B --no-transfer-progress clean verify
